
name: Build DuelPack APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        shell: bash
        run: |
          echo "Arquivos na raiz:"
          ls -la

          ZIP_FILE="./DuelPack_Android_v0.3.2_cartas_reais.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERRO: ZIP v0.3.1 não encontrado."
            exit 1
          fi

          echo "ZIP selecionado: $ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Locate Android project
        shell: bash
        run: |
          SETTINGS=$(find extracted \( -name settings.gradle -o -name settings.gradle.kts \) -type f | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado."
            find extracted -maxdepth 5 -type f | head -n 100
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
          echo "Projeto localizado: $(dirname "$SETTINGS")"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DuelPack-debug-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
